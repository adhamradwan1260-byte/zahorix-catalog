<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAhorix Watches</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* التنسيقات الخاصة بالهيدر والأقسام تحت اللوجو */
    .main-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 15px 0 15px;
      background-color: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      position: relative;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
      margin-bottom: 10px;
    }

    .header-logo img {
      max-height: 52px;
      width: auto;
      display: block;
    }

    .header-search {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 5px;
    }

    /* الشريط الأفقي للأقسام */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      padding-bottom: 8px;
    }

    .top-nav .nav-btn {
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #333333;
      cursor: pointer;
      padding: 6px 4px;
      position: relative;
      white-space: nowrap;
      transition: color 0.2s ease;
      font-family: inherit;
    }

    /* التنسيق للقسم النشط (خط ذهبي بالأسفل) */
    .top-nav .nav-btn.active {
      color: #c5a059;
    }

    .top-nav .nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #c5a059;
      border-radius: 2px;
    }

    /* القائمة المنسدلة لـ رجالي */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 50%;
      transform: translateX(50%);
      background-color: #ffffff;
      min-width: 140px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.12);
      border: 1px solid #eee;
      border-radius: 8px;
      z-index: 1000;
      padding: 6px 0;
      margin-top: 6px;
    }

    .dropdown-menu.show {
      display: block;
    }

    @media (hover: hover) {
      .dropdown:hover .dropdown-menu {
        display: block;
      }
    }

    .dropdown-item {
      display: block;
      width: 100%;
      padding: 10px 16px;
      text-align: right;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #333333;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background-color 0.2s, color 0.2s;
    }

    .dropdown-item:hover {
      background-color: #f8f9fa;
      color: #c5a059;
    }

    .dropdown-item.active {
      color: #c5a059;
    }
  </style>
</head>

<body>

  <header class="main-header">

    <div class="header-top-row">
      <div class="header-logo">
        <a href="./" onclick="event.preventDefault(); showCatalog();" aria-label="العودة إلى الصفحة الرئيسية">
          <img src="zahorix-logo.webp" alt="ZAhorix Watches">
        </a>
      </div>

      <button
        class="header-search"
        type="button"
        onclick="toggleSearch()"
        aria-label="البحث في الساعات"
      >
        🔍
      </button>
    </div>

    <!-- الأقسام تحت اللوجو -->
    <nav class="top-nav" aria-label="أقسام الكتالوج">
      <button type="button" class="nav-btn active" onclick="selectNavTab(this, 'all')">
        كل الساعات
      </button>

      <!-- قائمة رجالي المنسدلة -->
      <div class="dropdown">
        <button type="button" class="nav-btn dropdown-toggle" onclick="toggleDropdown(event)">
          رجالي ▾
        </button>
        <div class="dropdown-menu" id="menDropdown">
          <button type="button" class="dropdown-item" onclick="selectNavTab(this, 'رجالي')">
            كل الرجالي
          </button>
          <button type="button" class="dropdown-item" onclick="selectNavTab(this, 'رجالي استانلس')">
            رجالي استانلس
          </button>
          <button type="button" class="dropdown-item" onclick="selectNavTab(this, 'رجالي جلد')">
            رجالي جلد
          </button>
        </div>
      </div>
    </nav>

  </header>


  <!-- خانة البحث -->
  <div class="search-panel" id="searchPanel">

    <input
      id="searchInput"
      type="search"
      placeholder="ابحث باسم الساعة بالعربي أو الإنجليزي..."
      autocomplete="off"
      oninput="searchProducts(this.value)"
    >

    <button type="button" onclick="clearSearch()">
      مسح
    </button>

  </div>


  <!-- صفحة الكتالوج -->
  <main id="catalogView">

    <div id="products" class="grid"></div>

  </main>


  <!-- صفحة الساعة الخاصة -->
  <main id="productView" class="product-view" hidden>

    <div class="product-page-actions">

      <button
        class="back-button"
        type="button"
        onclick="showCatalog()"
      >
        ← العودة لكل الساعات
      </button>

      <button
        class="share-button"
        id="shareButton"
        type="button"
        onclick="shareCurrentProduct()"
      >
        🔗 مشاركة الساعة
      </button>

    </div>

    <div id="featuredProduct"></div>

    <section class="related-section">

      <h2 class="related-title">
        ساعات قد تعجبك أيضًا
      </h2>

      <div id="relatedProducts" class="grid related-grid"></div>

    </section>

  </main>


  <script>

    const phone = "201030808064⁩";

    let allProducts = [];

    let currentProduct = null;


    /* أسماء البحث البديلة */
    const searchAliases = {

      /* Rolex */
      "رولكس": "rolex",
      "روليكس": "rolex",
      "رولكس اويستر": "rolex oyster",
      "روليكس اويستر": "rolex oyster",
      "رولكس بيبسي": "rolex pepsi",
      "روليكس بيبسي": "rolex pepsi",
      "رولكس ستايل": "rolex style",
      "روليكس ستايل": "rolex style",
      "رولكس ازرق": "rolex style blue",
      "روليكس ازرق": "rolex style blue",

      /* Cartier */
      "كارتير": "cartier",
      "كارتيه": "cartier",
      "كارتييه": "cartier",
      "كارتير تانك": "cartier tank",
      "كارتيه تانك": "cartier tank",
      "كارتييه تانك": "cartier tank",

      /* Tissot */
      "تيسوت": "tissot",
      "تيسو": "tissot",
      "تيسوت كرونو": "tissot chrono",
      "تيسو كرونو": "tissot chrono",

      /* Audemars Piguet */
      "اوديمار": "audemars",
      "اوديمارس": "audemars",
      "اوديمار بيجيه": "audemarspiguet",
      "اوديمار بيغيه": "audemarspiguet",
      "اوديمارس بيجيه": "audemarspiguet",
      "اي بي": "ap",

      /* Categories */
      "ساعه جلد": "رجالي جلد",
      "ساعة جلد": "رجالي جلد",
      "ساعات جلد": "رجالي جلد",
      "جلد": "رجالي جلد",

      "ساعه استانلس": "رجالي استانلس",
      "ساعة استانلس": "رجالي استانلس",
      "ساعات استانلس": "رجالي استانلس",
      "استانلس": "رجالي استانلس",

      /* Features */
      "عدادات": "عدادات شغاله",
      "عدادات شغاله": "عدادات شغاله",
      "عدادات شغالة": "عدادات شغاله",

      /* Suede */
      "شمواه": "suede",
      "رولكس شمواه": "suede rolex",
      "روليكس شمواه": "suede rolex"

    };


    /* تحميل بيانات الساعات */
    fetch("products.json")
      .then(response => {

        if (!response.ok) {
          throw new Error("تعذر تحميل بيانات الساعات");
        }

        return response.json();

      })
      .then(products => {

        allProducts = products;

        loadPageFromUrl();

      })
      .catch(error => {

        console.error(error);

        document.getElementById("products").innerHTML = `
          <div class="no-results">
            حدث خطأ أثناء تحميل الساعات. حاول تحديث الصفحة.
          </div>
        `;

      });


    /* معرفة هل الرابط يحتوي على ساعة معينة */
    function loadPageFromUrl() {

      const urlParameters =
        new URLSearchParams(window.location.search);

      const productSlug =
        urlParameters.get("product");

      if (productSlug) {

        const product = allProducts.find(
          item => item.slug === productSlug
        );

        if (product) {
          renderProductPage(product, false);
          return;
        }

      }

      showCatalog(false);

    }


    /* إنشاء كارت ساعة */
    function createProductCard(product, options = {}) {

      const isFeatured = options.featured === true;

      const images =
        product.images || [product.image];

      const orderMessage = encodeURIComponent(
        `السلام عليكم أريد طلب ساعة ${product.name} السعر ${product.price}`
      );

      const productLink =
        `?product=${encodeURIComponent(product.slug)}`;

      return `
        <article class="card ${isFeatured ? "featured-card" : ""}">

          <div
            class="slider"
            data-product-slug="${product.slug}"
            data-current-index="0"
          >

            ${
              product.badge
                ? `<span class="badge">${product.badge}</span>`
                : ""
            }

            <img
              src="${images[0]}"
              class="product-img ${isFeatured ? "" : "clickable-product"}"
              alt="${product.name}"
              draggable="false"
              loading="${isFeatured ? "eager" : "lazy"}"
              ${
                isFeatured
                  ? ""
                  : `onclick="openProduct('${product.slug}')"`
              }
            >

            <div class="dots">

              ${images.map((image, imageIndex) => `
                <button
                  class="dot ${imageIndex === 0 ? "active" : ""}"
                  type="button"
                  onclick="event.stopPropagation(); changeImg(this.closest('.slider'), ${imageIndex})"
                  aria-label="عرض الصورة ${imageIndex + 1}"
                ></button>
              `).join("")}

            </div>

          </div>

          ${
            isFeatured
              ? `<h1 class="product-title">${product.name}</h1>`
              : `
                <h2>
                  <a
                    class="product-title-link"
                    href="${productLink}"
                  >
                    ${product.name}
                  </a>
                </h2>
              `
          }

          ${
            product.subtitle
              ? `<span class="subtitle">${product.subtitle}</span>`
              : ""
          }

          <div class="price">

            ${
              product.oldPrice
                ? `
                  <span class="old-price">
                    ${product.oldPrice}
                  </span>
                `
                : ""
            }

            <span class="new-price">
              ${product.price}
            </span>

          </div>

          ${
            !isFeatured
              ? `
                <a
                  class="product-details-button"
                  href="${productLink}"
                >
                  عرض الساعة
                </a>
              `
              : ""
          }

          <a
            class="btn call"
            href="tel:+${phone}"
          >
            ☎ اتصال
          </a>

          <a
            class="btn wa"
            target="_blank"
            rel="noopener noreferrer"
            href="https://wa.me/${phone}?text=${orderMessage}"
          >
            💬 واتساب
          </a>

          <a
            class="order"
            target="_blank"
            rel="noopener noreferrer"
            href="https://wa.me/${phone}?text=${orderMessage}"
          >
            🛒 اطلب الآن
          </a>

        </article>
      `;

    }


    /* عرض مجموعة ساعات */
    function renderProducts(products) {

      const productsBox =
        document.getElementById("products");

      productsBox.innerHTML = "";

      if (products.length === 0) {

        productsBox.innerHTML = `
          <div class="no-results">
            لا توجد ساعات مطابقة لبحثك.
          </div>
        `;

        return;

      }

      productsBox.innerHTML = products
        .map(product => createProductCard(product))
        .join("");

      initSwipe();

    }


    /* فتح صفحة ساعة معينة */
    function openProduct(productSlug) {

      const product = allProducts.find(
        item => item.slug === productSlug
      );

      if (!product) {
        return;
      }

      const productUrl =
        `${window.location.pathname}?product=${encodeURIComponent(productSlug)}`;

      window.history.pushState(
        { product: productSlug },
        "",
        productUrl
      );

      renderProductPage(product, false);

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* عرض صفحة الساعة */
    function renderProductPage(product, updateHistory = true) {

      currentProduct = product;

      const catalogView =
        document.getElementById("catalogView");

      const productView =
        document.getElementById("productView");

      const featuredProduct =
        document.getElementById("featuredProduct");

      const relatedProductsBox =
        document.getElementById("relatedProducts");

      const searchPanel =
        document.getElementById("searchPanel");

      catalogView.hidden = true;

      productView.hidden = false;

      searchPanel.classList.remove("open");

      featuredProduct.innerHTML =
        createProductCard(product, {
          featured: true
        });

      const relatedProducts =
        getRelatedProducts(product);

      relatedProductsBox.innerHTML = relatedProducts
        .map(item => createProductCard(item))
        .join("");

      if (updateHistory) {

        const productUrl =
          `${window.location.pathname}?product=${encodeURIComponent(product.slug)}`;

        window.history.pushState(
          { product: product.slug },
          "",
          productUrl
        );

      }

      document.title =
        `${product.name} | ZAhorix Watches`;

      initSwipe();

    }


    /* ترتيب الساعات المقترحة */
    function getRelatedProducts(selectedProduct) {

      return allProducts
        .filter(product =>
          product.slug !== selectedProduct.slug
        )
        .sort((firstProduct, secondProduct) => {

          const firstScore =
            getRelatedProductScore(
              firstProduct,
              selectedProduct
            );

          const secondScore =
            getRelatedProductScore(
              secondProduct,
              selectedProduct
            );

          return secondScore - firstScore;

        });

    }


    /* حساب أولوية المنتج المقترح */
    function getRelatedProductScore(product, selectedProduct) {

      let score = 0;

      if (
        product.brand &&
        selectedProduct.brand &&
        product.brand === selectedProduct.brand
      ) {
        score += 10;
      }

      if (
        product.category &&
        selectedProduct.category &&
        product.category === selectedProduct.category
      ) {
        score += 5;
      }

      return score;

    }


    /* العودة لكل الساعات */
    function showCatalog(updateHistory = true) {

      currentProduct = null;

      const catalogView =
        document.getElementById("catalogView");

      const productView =
        document.getElementById("productView");

      const searchInput =
        document.getElementById("searchInput");

      catalogView.hidden = false;

      productView.hidden = true;

      searchInput.value = "";

      renderProducts(allProducts);

      document.title = "ZAhorix Watches";

      /* إعادة ضبط القسم النشط إلى الأول (كل الساعات) */
      const firstNavBtn = document.querySelector('.top-nav .nav-btn');
      if (firstNavBtn) {
        document.querySelectorAll('.top-nav .nav-btn, .dropdown-item').forEach(btn => btn.classList.remove('active'));
        firstNavBtn.classList.add('active');
      }

      if (updateHistory) {

        window.history.pushState(
          {},
          "",
          window.location.pathname
        );

      }

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* مشاركة رابط الساعة */
    async function shareCurrentProduct() {

      if (!currentProduct) {
        return;
      }

      const shareButton =
        document.getElementById("shareButton");

      const productUrl =
        `${window.location.origin}${window.location.pathname}?product=${encodeURIComponent(currentProduct.slug)}`;

      const shareData = {
        title: currentProduct.name,
        text: `شاهد ساعة ${currentProduct.name} بسعر ${currentProduct.price}`,
        url: productUrl
      };

      try {

        if (navigator.share) {

          await navigator.share(shareData);

          return;

        }

        await navigator.clipboard.writeText(productUrl);

        shareButton.textContent = "✅ تم نسخ الرابط";

        setTimeout(() => {
          shareButton.textContent = "🔗 مشاركة الساعة";
        }, 2000);

      } catch (error) {

        if (error.name !== "AbortError") {

          window.prompt(
            "انسخ رابط الساعة:",
            productUrl
          );

        }

      }

    }


    /* فتح وإغلاق البحث */
    function toggleSearch() {

      const searchPanel =
        document.getElementById("searchPanel");

      const searchInput =
        document.getElementById("searchInput");

      if (currentProduct) {
        showCatalog();
      }

      searchPanel.classList.toggle("open");

      if (searchPanel.classList.contains("open")) {

        setTimeout(() => {
          searchInput.focus();
        }, 100);

      }

    }


    /* توحيد طريقة كتابة كلمات البحث */
    function normalizeSearchText(text) {

      return String(text || "")
        .toLowerCase()
        .trim()
        .replace(/[أإآ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        .replace(/ؤ/g, "و")
        .replace(/ئ/g, "ي")
        .replace(/[\u064B-\u065F]/g, "")
        .replace(/[()_-]/g, " ")
        .replace(/\s+/g, " ");

    }


    /* استخراج الكلمات المقابلة للبحث العربي */
    function getSearchTerms(searchValue) {

      const normalizedValue =
        normalizeSearchText(searchValue);

      const searchTerms = [normalizedValue];

      Object.entries(searchAliases).forEach(
        ([arabicName, englishName]) => {

          const normalizedArabicName =
            normalizeSearchText(arabicName);

          const normalizedEnglishName =
            normalizeSearchText(englishName);

          if (
            normalizedArabicName.includes(normalizedValue) ||
            normalizedValue.includes(normalizedArabicName)
          ) {
            searchTerms.push(normalizedEnglishName);
          }

        }
      );

      return [...new Set(searchTerms)];

    }


    /* البحث بالعربي والإنجليزي */
    function searchProducts(searchValue) {

      const normalizedValue =
        normalizeSearchText(searchValue);

      if (currentProduct) {

        document.getElementById("catalogView").hidden = false;

        document.getElementById("productView").hidden = true;

        currentProduct = null;

      }

      if (normalizedValue === "") {

        renderProducts(allProducts);

        return;

      }

      const searchTerms =
        getSearchTerms(searchValue);

      const filteredProducts =
        allProducts.filter(product => {

          const productKeywords =
            Array.isArray(product.keywords)
              ? product.keywords.join(" ")
              : "";

          const searchableText =
            normalizeSearchText(`
              ${product.name || ""}
              ${product.brand || ""}
              ${product.category || ""}
              ${product.subtitle || ""}
              ${product.badge || ""}
              ${productKeywords}
            `);

          return searchTerms.some(term =>
            searchableText.includes(term)
          );

        });

      renderProducts(filteredProducts);

    }


    /* مسح البحث */
    function clearSearch() {

      const searchInput =
        document.getElementById("searchInput");

      searchInput.value = "";

      if (currentProduct) {

        document.getElementById("catalogView").hidden = false;

        document.getElementById("productView").hidden = true;

        currentProduct = null;

      }

      renderProducts(allProducts);

      searchInput.focus();

    }


    /* فتح وإغلاق القائمة المنسدلة */
    function toggleDropdown(event) {
      event.stopPropagation();
      const dropdown = document.getElementById("menDropdown");
      if (dropdown) {
        dropdown.classList.toggle("show");
      }
    }

    /* إغلاق القائمة المنسدلة عند الضغط خارجها */
    window.addEventListener("click", function (event) {
      const dropdown = document.getElementById("menDropdown");
      if (dropdown && !event.target.closest(".dropdown")) {
        dropdown.classList.remove("show");
      }
    });


    /* اختيار وتحديد القسم النشط */
    function selectNavTab(element, category) {

      document.querySelectorAll('.top-nav .nav-btn, .dropdown-item').forEach(btn => {
        btn.classList.remove('active');
      });

      if (element) {
        element.classList.add('active');

        /* لو الاختيار من القائمة المنسدلة يحدد الأب أيضاً */
        if (element.classList.contains('dropdown-item')) {
          const toggle = element.closest('.dropdown')?.querySelector('.dropdown-toggle');
          if (toggle) toggle.classList.add('active');
        }
      }

      /* إغلاق القائمة بعد الاختيار */
      const dropdown = document.getElementById("menDropdown");
      if (dropdown) dropdown.classList.remove("show");

      filterProducts(category);

    }


    /* فلترة الأقسام */
    function filterProducts(category) {

      const searchInput =
        document.getElementById("searchInput");

      searchInput.value = "";

      currentProduct = null;

      document.getElementById("catalogView").hidden = false;

      document.getElementById("productView").hidden = true;

      window.history.pushState(
        {},
        "",
        window.location.pathname
      );

      if (category === "all") {

        renderProducts(allProducts);

        return;

      }

      /* إذا تم اختيار كل الساعات الرجالي */
      if (category === "رجالي") {
        const filteredProducts = allProducts.filter(
          product => product.category && product.category.includes("رجالي")
        );
        renderProducts(filteredProducts);
        return;
      }

      const filteredProducts =
        allProducts.filter(
          product => product.category === category
        );

      renderProducts(filteredProducts);

    }


    /* تغيير صورة الساعة */
    function changeImg(slider, imageIndex) {

      if (!slider) {
        return;
      }

      const productSlug =
        slider.dataset.productSlug;

      const product =
        allProducts.find(
          item => item.slug === productSlug
        );

      if (!product) {
        return;
      }

      const images =
        product.images || [product.image];

      const imageElement =
        slider.querySelector(".product-img");

      const dots =
        slider.querySelectorAll(".dot");

      imageElement.src =
        images[imageIndex];

      slider.dataset.currentIndex =
        imageIndex;

      dots.forEach(dot => {
        dot.classList.remove("active");
      });

      if (dots[imageIndex]) {
        dots[imageIndex].classList.add("active");
      }

    }


    /* الصورة التالية */
    function nextImg(slider) {

      const productSlug =
        slider.dataset.productSlug;

      const product =
        allProducts.find(
          item => item.slug === productSlug
        );

      if (!product) {
        return;
      }

      const images =
        product.images || [product.image];

      let currentIndex =
        Number(slider.dataset.currentIndex || 0);

      currentIndex++;

      if (currentIndex >= images.length) {
        currentIndex = 0;
      }

      changeImg(slider, currentIndex);

    }


    /* الصورة السابقة */
    function prevImg(slider) {

      const productSlug =
        slider.dataset.productSlug;

      const product =
        allProducts.find(
          item => item.slug === productSlug
        );

      if (!product) {
        return;
      }

      const images =
        product.images || [product.image];

      let currentIndex =
        Number(slider.dataset.currentIndex || 0);

      currentIndex--;

      if (currentIndex < 0) {
        currentIndex = images.length - 1;
      }

      changeImg(slider, currentIndex);

    }


    /* السحب بين الصور على الموبايل */
    function initSwipe() {

      document.querySelectorAll(".slider").forEach(slider => {

        if (slider.dataset.swipeReady === "true") {
          return;
        }

        slider.dataset.swipeReady = "true";

        let startX = 0;
        let endX = 0;
        let didSwipe = false;

        slider.addEventListener(
          "touchstart",
          event => {

            startX =
              event.touches[0].clientX;

            endX = startX;

            didSwipe = false;

          },
          { passive: true }
        );

        slider.addEventListener(
          "touchmove",
          event => {

            endX =
              event.touches[0].clientX;

            if (Math.abs(startX - endX) > 15) {
              didSwipe = true;
            }

          },
          { passive: true }
        );

        slider.addEventListener(
          "touchend",
          () => {

            const difference =
              startX - endX;

            if (Math.abs(difference) > 40) {

              if (difference > 0) {
                nextImg(slider);
              } else {
                prevImg(slider);
              }

            }

            setTimeout(() => {
              didSwipe = false;
            }, 100);

          }
        );

      });

    }


    /* زر الرجوع في المتصفح */
    window.addEventListener(
      "popstate",
      loadPageFromUrl
    );

  </script>

</body>
