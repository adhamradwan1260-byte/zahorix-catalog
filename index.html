<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>ZAhorix Watches</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>ZAhorix Watches</h1>
  <p>اختار ساعتك واطلبها بسهولة</p>
</header>

<div class="cats">
  <button>كل الساعات</button>
  <button>رجالي</button>
</div>

<div id="products" class="grid"></div>

<script>
const phone = "201283337061";
let allProducts = [];

fetch("products.json")
.then(r => r.json())
.then(products => {
  allProducts = products;
  const box = document.getElementById("products");
  box.innerHTML = "";

  products.forEach((p, productIndex) => {
    let imgs = p.images || [p.image];

    box.innerHTML += `
      <div class="card">
        <div class="slider" 
             data-product-index="${productIndex}"
             data-current-index="0">
             
          <img 
            id="img-${productIndex}" 
            src="${imgs[0]}" 
            class="product-img"
            alt="${p.name}"
            draggable="false"
          >

          <div class="dots" id="dots-${productIndex}">
            ${imgs.map((img, imgIndex) => `
              <span 
                class="dot ${imgIndex === 0 ? 'active' : ''}" 
                onclick="changeImg(${productIndex}, ${imgIndex})">
              </span>
            `).join("")}
          </div>
        </div>

        <h2>${p.name}</h2>

        <div class="price">
          <span class="old-price">${p.oldPrice || ""}</span>
          <span class="new-price">${p.price}</span>
        </div>

        <a class="btn call" href="tel:${phone}">☎ اتصال</a>

        <a 
          class="btn wa" 
          target="_blank" 
          href="https://wa.me/${phone}?text=السلام عليكم أريد طلب ساعة ${p.name} السعر ${p.price}">
          💬 واتساب
        </a>

        <a 
          class="order" 
          target="_blank" 
          href="https://wa.me/${phone}?text=السلام عليكم أريد طلب ساعة ${p.name} السعر ${p.price}">
          🛒 اطلب الآن
        </a>
      </div>
    `;
  });

  initSwipe();
});

function changeImg(productIndex, imgIndex) {
  const product = allProducts[productIndex];
  const imgs = product.images || [product.image];

  const imgEl = document.getElementById(`img-${productIndex}`);
  const dotsWrap = document.getElementById(`dots-${productIndex}`);
  const dots = dotsWrap.querySelectorAll(".dot");
  const slider = document.querySelector(`.slider[data-product-index="${productIndex}"]`);

  imgEl.src = imgs[imgIndex];
  slider.setAttribute("data-current-index", imgIndex);

  dots.forEach(dot => dot.classList.remove("active"));
  dots[imgIndex].classList.add("active");
}

function nextImg(productIndex) {
  const product = allProducts[productIndex];
  const imgs = product.images || [product.image];
  const slider = document.querySelector(`.slider[data-product-index="${productIndex}"]`);
  let currentIndex = parseInt(slider.getAttribute("data-current-index"));

  currentIndex++;
  if (currentIndex >= imgs.length) currentIndex = 0;

  changeImg(productIndex, currentIndex);
}

function prevImg(productIndex) {
  const product = allProducts[productIndex];
  const imgs = product.images || [product.image];
  const slider = document.querySelector(`.slider[data-product-index="${productIndex}"]`);
  let currentIndex = parseInt(slider.getAttribute("data-current-index"));

  currentIndex--;
  if (currentIndex < 0) currentIndex = imgs.length - 1;

  changeImg(productIndex, currentIndex);
}

function initSwipe() {
  const sliders = document.querySelectorAll(".slider");

  sliders.forEach(slider => {
    let startX = 0;
    let endX = 0;

    slider.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    slider.addEventListener("touchmove", e => {
      endX = e.touches[0].clientX;
    }, { passive: true });

    slider.addEventListener("touchend", () => {
      const diff = startX - endX;
      const productIndex = parseInt(slider.getAttribute("data-product-index"));

      if (Math.abs(diff) > 40) {
        if (diff > 0) {
          nextImg(productIndex);
        } else {
          prevImg(productIndex);
        }
      }

      startX = 0;
      endX = 0;
    });
  });
}
</script>

</body>
</html>
