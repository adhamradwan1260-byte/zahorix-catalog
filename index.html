<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ZAhorix Watches</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>ZAhorix Watches</h1>

<p>اختار ساعتك واطلبها بسهولة</p>

</header>





<div class="cats">


<button onclick="filterProducts('all')">
كل الساعات
</button>


<button onclick="filterProducts('رجالي')">
رجالي
</button>


</div>






<div class="search-container">


<div class="search-box">


<input 
type="text" 
id="searchInput"
placeholder="ابحث عن الساعة..."
oninput="searchProducts()"
>


</div>


</div>






<div id="products" class="grid"></div>








<script>


const phone = "201283337061";


let allProducts = [];






fetch("products.json")

.then(r=>r.json())

.then(products=>{


allProducts = products;


renderProducts(allProducts);


});









function renderProducts(products){


const box = document.getElementById("products");


box.innerHTML = "";



products.forEach((p)=>{



let imgs = p.images || [p.image];






box.innerHTML += `


<div class="card">



<div class="slider"

data-product-name="${p.name}"

data-current-index="0">






${p.badge ? `<span class="badge">${p.badge}</span>` : ""}







<img

src="${imgs[0]}"

class="product-img"

alt="${p.name}"

draggable="false"

>






<div class="dots">



${imgs.map((img,i)=>`


<span

class="dot ${i===0?'active':''}"

onclick="changeImg('${p.name}',${i},this)">

</span>


`).join("")}



</div>




</div>






<h2>${p.name}</h2>



${p.subtitle ? `<span class="subtitle">${p.subtitle}</span>` : ""}





<div class="price">


<span class="old-price">

${p.oldPrice || ""}

</span>


<span class="new-price">

${p.price}

</span>



</div>







<a class="btn call" href="tel:${phone}">

☎ اتصال

</a>






<a 

class="btn wa"

target="_blank"

href="https://wa.me/${phone}?text=السلام عليكم أريد طلب ساعة ${p.name} السعر ${p.price}">


💬 واتساب


</a>







<a 

class="order"

target="_blank"

href="https://wa.me/${phone}?text=السلام عليكم أريد طلب ساعة ${p.name} السعر ${p.price}">


🛒 اطلب الآن


</a>






</div>


`;



});




initSwipe();



}









function filterProducts(category){



if(category==="all"){


renderProducts(allProducts);


}

else{


let filtered = allProducts.filter(product=>product.category===category);


renderProducts(filtered);


}



}









function searchProducts(){



let value = document

.getElementById("searchInput")

.value

.toLowerCase()

.trim();




let results = allProducts.filter(product=>{


return product.name

.toLowerCase()

.includes(value);



});



renderProducts(results);



}
function changeImg(productName,imgIndex,dotElement){


const product = allProducts.find(
p => p.name === productName
);



if(!product) return;



const imgs = product.images || [product.image];



const slider = [...document.querySelectorAll(".slider")]

.find(
s => s.dataset.productName === productName
);



if(!slider) return;



const imgEl = slider.querySelector(".product-img");



imgEl.src = imgs[imgIndex];



slider.setAttribute(
"data-current-index",
imgIndex
);



const dots = slider.querySelectorAll(".dot");



dots.forEach(dot=>{

dot.classList.remove("active");

});



if(dotElement){

dotElement.classList.add("active");

}

else if(dots[imgIndex]){

dots[imgIndex].classList.add("active");

}



}








function nextImg(slider){



const productName = slider.dataset.productName;



const product = allProducts.find(

p => p.name === productName

);



if(!product) return;



const imgs = product.images || [product.image];



let current = parseInt(

slider.getAttribute("data-current-index")

);



current++;



if(current >= imgs.length){

current = 0;

}



changeImg(productName,current);



}









function prevImg(slider){



const productName = slider.dataset.productName;



const product = allProducts.find(

p => p.name === productName

);



if(!product) return;



const imgs = product.images || [product.image];



let current = parseInt(

slider.getAttribute("data-current-index")

);



current--;



if(current < 0){

current = imgs.length - 1;

}



changeImg(productName,current);



}









function initSwipe(){



document.querySelectorAll(".slider")

.forEach(slider=>{



let startX = 0;

let endX = 0;





slider.addEventListener(

"touchstart",

e=>{


startX = e.touches[0].clientX;


},

{passive:true}

);







slider.addEventListener(

"touchmove",

e=>{


endX = e.touches[0].clientX;


},

{passive:true}

);








slider.addEventListener(

"touchend",

()=>{



let diff = startX - endX;



if(Math.abs(diff)>40){



if(diff > 0){


nextImg(slider);


}

else{


prevImg(slider);


}


}



}


);



});



}



</script>


</body>

</html>
