<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ZAhorix Watches</title>

<link rel="stylesheet" href="style.css">
</head>


<body>


<header>
<h1>ZAhorix Watches</h1>
<p>اختار ساعتك واطلبها بسهولة</p>
</header>




<div class="cats">

<button onclick="filterProducts('all')">
كل الساعات
</button>

<button onclick="filterProducts('رجالي')">
رجالي
</button>

</div>




<div class="search-container">

<div class="search-box">

<input 
type="text" 
id="searchInput"
placeholder="ابحث عن الساعة..."
oninput="searchProducts()"
>

</div>

</div>





<div id="products" class="grid"></div>






<script>


const phone = "201283337061";

let allProducts = [];





fetch("products.json")

.then(r=>r.json())

.then(products=>{

allProducts = products;

renderProducts(allProducts);

});









function renderProducts(products){


const box = document.getElementById("products");

box.innerHTML = "";



products.forEach((p,index)=>{


let imgs = p.images || [p.image];



box.innerHTML += `


<div class="card">


<div class="slider"
data-product-index="${index}"
data-current-index="0">



<img
id="img-${index}"
src="${imgs[0]}"
class="product-img"
alt="${p.name}"
draggable="false"
>




<div class="dots"
id="dots-${index}">


${imgs.map((img,i)=>`

<span
class="dot ${i===0?'active':''}"
onclick="changeImg(${index},${i})">
</span>

`).join("")}


</div>



</div>






<h2>${p.name}</h2>




<div class="price">

<span class="old-price">
${p.oldPrice || ""}
</span>


<span class="new-price">
${p.price}
</span>


</div>






<a class="btn call" href="tel:${phone}">
☎ اتصال
</a>





<a 
class="btn wa"
target="_blank"
href="https://wa.me/${phone}?text=السلام عليكم أريد طلب ساعة ${p.name} السعر ${p.price}">

💬 واتساب

</a>





<a 
class="order"
target="_blank"
href="https://wa.me/${phone}?text=السلام عليكم أريد طلب ساعة ${p.name} السعر ${p.price}">

🛒 اطلب الآن

</a>





</div>


`;



});



initSwipe();


}









function filterProducts(category){


if(category==="all"){


renderProducts(allProducts);


}

else{


let filtered = allProducts.filter(product=>product.category===category);


renderProducts(filtered);


}


}









function searchProducts(){


let value = document
.getElementById("searchInput")
.value
.toLowerCase()
.trim();



let results = allProducts.filter(product=>{


return product.name
.toLowerCase()
.includes(value);


});



renderProducts(results);



}









function changeImg(productIndex,imgIndex){



const product = allProducts[productIndex];


const imgs = product.images || [product.image];



const imgEl = document.getElementById(`img-${productIndex}`);



imgEl.src = imgs[imgIndex];



const dots = document
.getElementById(`dots-${productIndex}`)
.querySelectorAll(".dot");



dots.forEach(dot=>dot.classList.remove("active"));

dots[imgIndex].classList.add("active");



}









function nextImg(index){



const slider = document.querySelector(
`.slider[data-product-index="${index}"]`
);



let current = parseInt(
slider.getAttribute("data-current-index")
);



let imgs = allProducts[index].images;



current++;


if(current >= imgs.length)
current = 0;



slider.setAttribute(
"data-current-index",
current
);



changeImg(index,current);


}









function prevImg(index){



const slider = document.querySelector(
`.slider[data-product-index="${index}"]`
);



let current = parseInt(
slider.getAttribute("data-current-index")
);



let imgs = allProducts[index].images;



current--;


if(current < 0)
current = imgs.length - 1;



slider.setAttribute(
"data-current-index",
current
);



changeImg(index,current);



}









function initSwipe(){



document.querySelectorAll(".slider")
.forEach(slider=>{


let startX = 0;

let endX = 0;



slider.addEventListener(
"touchstart",
e=>{

startX = e.touches[0].clientX;

},
{passive:true}
);





slider.addEventListener(
"touchmove",
e=>{

endX = e.touches[0].clientX;

},
{passive:true}
);






slider.addEventListener(
"touchend",
()=>{


let diff = startX - endX;



let index = parseInt(
slider.getAttribute("data-product-index")
);



if(Math.abs(diff)>40){


if(diff>0){

nextImg(index);

}

else{

prevImg(index);

}


}



});


});


}




</script>


</body>

</html>
